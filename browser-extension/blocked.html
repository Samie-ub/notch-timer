<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browser Focus · settime</title>
  <link rel="stylesheet" href="page.css">
</head>
<body>
  <main class="blocked-shell">
    <header class="brand">
      <img src="icon48.png" alt="" width="36" height="36">
      <span>settime</span>
      <span class="brand-divider" aria-hidden="true"></span>
      <span class="brand-product">BROWSER FOCUS</span>
    </header>
    <section class="focus-card" aria-live="polite">
      <div class="focus-mark" aria-hidden="true"><span></span><span></span></div>
      <p class="eyebrow">A MOMENT FOR WHAT MATTERS</p>
      <h1 id="title">Focus session active</h1>
      <p id="status" class="session-status" role="status">Checking your timer…</p>
      <p class="description">Your page is still here. Pause or finish your timer in settime when you’re ready to return.</p>
      <button id="back" type="button">Go back</button>
    </section>
    <footer>Focus by settime</footer>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
